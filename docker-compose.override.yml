services:
  db:
    ports:
      - "127.0.0.1:3309:3306"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: moneta_mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: moneta_redisinsight
    ports:
      - "127.0.0.1:5540:5540"
    depends_on:
      - redis
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: local
    container_name: moneta_cron
    volumes:
      - .:/var/www/html/moneta
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c "echo '0 1 * * * php /var/www/html/moneta/bin/run-recurrences.php >> /var/www/html/moneta/storage/logs/cron.log 2>&1' | crontab -
      && cron -f"
    restart: unless-stopped