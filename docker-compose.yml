services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneta_app
    ports:
      - "127.0.0.1:8009:80"
    volumes:
      - .:/var/www/html/moneta
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: moneta_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moneta
    volumes:
      - moneta_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moneta_redis
    restart: unless-stopped

volumes:
  moneta_db_data: